<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>主页 - 时代少年团AI聊天</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"PingFang SC",sans-serif; background:#0f0f1a; color:#fff; padding-bottom:70px; }
.topbar { position:sticky; top:0; background:#0f0f1a; padding:12px 16px; z-index:10; }
.searchbar { width:100%; padding:10px 16px; border-radius:20px; border:none; background:#1e1e30; color:#fff; font-size:14px; outline:none; }
.content { padding:12px 16px; }
.section-title { font-size:16px; font-weight:bold; margin:16px 0 10px; color:#ffd700; }
.grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.card { background:#1a1a2e; border-radius:12px; overflow:hidden; }
.card img, .card .video-placeholder { width:100%; height:180px; object-fit:cover; background:#2a2a45; display:flex; align-items:center; justify-content:center; color:#666; font-size:32px; }
.card-info { padding:8px 10px; }
.card-info .date { font-size:11px; color:#888; }
.card-info .desc { font-size:13px; margin-top:2px; }
.empty { text-align:center; color:#666; padding:60px 0; font-size:14px; }
</style>
</head>
<body>
  <div class="topbar">
    <input class="searchbar" id="search" placeholder="🔍 搜索成员名字，如：马嘉祺">
  </div>
  <div class="content">
    <div class="section-title">✨ 精彩瞬间</div>
    <div class="grid" id="mediaGrid"></div>
    <div class="empty" id="emptyTip" style="display:none">没有找到相关内容</div>
  </div>

<script>
// 媒体数据（后期你可以在服务器上加个管理接口来增删，先用写死的数据跑通）
const MEDIA = [
  { type:"image", date:"2025-08-25", desc:"七周年成团纪念日直播合照", tag:"全员", url:"https://你的图片链接/1.jpg" },
  { type:"image", date:"2025-06-01", desc:"加冠礼演唱会上海站舞台照", tag:"全员", url:"https://你的图片链接/2.jpg" },
  { type:"image", date:"2025-05-20", desc:"马嘉祺个人EP宣传照", tag:"马嘉祺", url:"https://你的图片链接/3.jpg" },
  { type:"video", date:"2025-04-18", desc:"团综《浅炸一下吧》幕后花絮", tag:"全员", url:"https://你的视频链接/1.mp4" },
  { type:"image", date:"2025-03-10", desc:"宋亚轩生日直播截图", tag:"宋亚轩", url:"https://你的图片链接/4.jpg" },
  { type:"image", date:"2025-02-14", desc:"刘耀文张真源综艺录制路透", tag:"刘耀文", url:"https://你的图片链接/5.jpg" },
];

function render(list) {
  const grid = document.getElementById("mediaGrid");
  document.getElementById("emptyTip").style.display = list.length ? "none" : "block";
  grid.innerHTML = list.map(m => `
    <div class="card">
      ${m.type === "video"
        ? `<div class="video-placeholder">▶</div>`
        : `<img src="${m.url}" onerror="this.style.background='#2a2a45';this.removeAttribute('src')">`}
      <div class="card-info">
        <div class="date">${m.date}</div>
        <div class="desc">${m.desc}</div>
      </div>
    </div>`).join("");
}

document.getElementById("search").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  render(q ? MEDIA.filter(m => m.desc.toLowerCase().includes(q) || m.tag.toLowerCase().includes(q)) : MEDIA);
});

render(MEDIA);
</script>
</body>
</html>
