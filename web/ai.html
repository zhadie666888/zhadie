<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI - 时代少年团AI聊天</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"PingFang SC",sans-serif; background:#0f0f1a; color:#fff; padding-bottom:70px; }
.header { padding:20px 16px 8px; }
.header h2 { font-size:18px; color:#ffd700; }
.header p { font-size:12px; color:#888; margin-top:4px; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:16px; }
.avatar-card { background:#1a1a2e; border-radius:16px; padding:16px 8px; text-align:center; cursor:pointer; transition:transform .15s; }
.avatar-card:active { transform:scale(.95); }
.avatar { width:64px; height:64px; border-radius:50%; margin:0 auto 8px; background:linear-gradient(135deg,#6c5ce7,#a29bfe); display:flex; align-items:center; justify-content:center; font-size:30px; }
.avatar-card .name { font-size:14px; font-weight:bold; }
.avatar-card .role { font-size:11px; color:#888; margin-top:2px; }
.vip-tip { text-align:center; font-size:11px; color:#b8860b; padding:8px; }
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:100; flex-direction:column; }
.modal.show { display:flex; }
.chat-header { background:#1a1a2e; padding:14px 16px; display:flex; align-items:center; gap:10px; }
.chat-header .back { color:#ffd700; font-size:20px; cursor:pointer; padding:0 8px; }
.chat-header .name { font-weight:bold; }
#chatBox { flex:1; overflow-y:auto; padding:16px; }
.msg { margin-bottom:14px; display:flex; gap:8px; }
.msg.me { flex-direction:row-reverse; }
.msg .avatar-sm { width:36px; height:36px; border-radius:50%; background:#2a2a45; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
.msg .bubble { background:#1e1e30; padding:10px 14px; border-radius:12px; max-width:70%; font-size:14px; word-break:break-word; }
.msg.me .bubble { background:#6c5ce7; }
.input-bar { display:flex; padding:10px; background:#1a1a2e; gap:8px; }
.input-bar input { flex:1; border:none; outline:none; padding:12px; border-radius:20px; background:#2a2a45; color:#fff; font-size:14px; }
.input-bar button { border:none; background:#ffd700; color:#1a1a2e; padding:0 20px; border-radius:20px; font-weight:bold; cursor:pointer; }
.limit-tip { text-align:center; font-size:12px; color:#888; padding:4px; }
</style>
</head>
<body>
  <div class="header">
    <h2>💫 和TA们聊天</h2>
    <p id="quota">免费用户每天10句 · VIP无限畅聊</p>
  </div>
  <div class="grid" id="charGrid"></div>
  <div class="vip-tip">💛 开通VIP，不限次数倾诉你的心事</div>

  <div class="modal" id="chatModal">
    <div class="chat-header">
      <span class="back" onclick="closeChat()">‹</span>
      <span class="avatar-sm" id="chatAvatar"></span>
      <span class="name" id="chatName"></span>
    </div>
    <div id="chatBox"></div>
    <div class="limit-tip" id="limitTip"></div>
    <div class="input-bar">
      <input id="aiInput" placeholder="说点什么吧…" onkeydown="if(event.key==='Enter')sendAI()">
      <button onclick="sendAI()">发送</button>
    </div>
  </div>

<script>
const SERVER = localStorage.getItem("server_url") || "";
const CHARACTERS = [
  { id:"majiaqi", name:"马嘉祺", avatar:"🎹", role:"温柔队长" },
  { id:"dingchengxin", name:"丁程鑫", avatar:"💫", role:"细腻暖男" },
  { id:"songyaxuan", name:"宋亚轩", avatar:"☁️", role:"软萌爱笑" },
  { id:"liuyaowen", name:"刘耀文", avatar:"🐺", role:"热血少年" },
  { id:"zhangzhenyuan", name:"张真源", avatar:"🌞", role:"治愈系" },
  { id:"yanhaoxiang", name:"严浩翔", avatar:"🎤", role:"傲娇rapper" },
  { id:"hejunlin", name:"贺峻霖", avatar:"🎙️", role:"气氛担当" },
];

document.getElementById("charGrid").innerHTML = CHARACTERS.map(c => `
  <div class="avatar-card" onclick="openChat('${c.id}')">
    <div class="avatar">${c.avatar}</div>
    <div class="name">${c.name}</div>
    <div class="role">${c.role}</div>
  </div>`).join("");

let ws = null;
let currentChar = null;

function connect() {
  return new Promise((resolve, reject) => {
    const token = localStorage.getItem("token");
    if (!token) { location.href = "/me"; return; }
    ws = new WebSocket(SERVER.replace(/^http/, "ws") || `ws://${location.host}`);
    ws.onopen = () => ws.send(JSON.stringify({ type:"auth", token }));
    ws.onmessage = (e) => {
      const d = JSON.parse(e.data);
      if (d.type === "auth_ok") { resolve(); return; }
      if (d.type === "ai_reply") {
        addMsg(false, d.avatar, d.content);
        loading(false);
      } else if (d.type === "ai_used") {
        document.getElementById("limitTip").textContent = `今日已用 ${d.used}/${d.limit}`;
      } else if (d.type === "ai_limit") {
        alert(d.content);
        if (confirm("是否查看VIP套餐？")) showVipPlans();
      } else if (d.type === "punish") {
        alert(d.content);
      } else if (d.type === "kicked") {
        alert(d.content); location.href = "/me";
      }
    };
    ws.onerror = reject;
  });
}

async function openChat(charId) {
  currentChar = CHARACTERS.find(c => c.id === charId);
  document.getElementById("chatModal").classList.add("show");
  document.getElementById("chatName").textContent = currentChar.name;
  document.getElementById("chatAvatar").textContent = currentChar.avatar;
  document.getElementById("chatBox").innerHTML = "";
  addMsg(false, currentChar.avatar, "嗨～很高兴见到你呀，想聊点什么呢？");
  await connect();
}

function closeChat() {
  document.getElementById("chatModal").classList.remove("show");
  if (ws) { ws.close(); ws = null; }
}

function addMsg(isMe, avatar, text) {
  const box = document.getElementById("chatBox");
  box.insertAdjacentHTML("beforeend", `
    <div class="msg ${isMe ? "me" : ""}">
      <div class="avatar-sm">${isMe ? "😄" : avatar}</div>
      <div class="bubble">${escapeHtml(text)}</div>
    </div>`);
  box.scrollTop = box.scrollHeight;
}

function loading(show) {
  document.getElementById("limitTip").textContent = show ? "对方正在输入…" : "";
}

function sendAI() {
  const input = document.getElementById("aiInput");
  const text = input.value.trim();
  if (!text || !ws) return;
  addMsg(true, "", text);
  input.value = "";
  loading(true);
  ws.send(JSON.stringify({ type:"ai_chat", character_id: currentChar.id, content: text }));
}

function showVipPlans() {
  location.href = "/me";
}

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
</script>
</body>
</html>
